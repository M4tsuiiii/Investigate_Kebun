# SAIKI Configuration
# Copy and customize for your environment

[application]
name = "Kebun Reaktivasi Massal"
version = "3.0.0"
edition = "Light Commercial"

[serial]
baud_rates = [9600, 19200, 115200]
scan_timeout = 1.0
at_timeout = 2.0
read_timeout = 20.0

[ussd]
dial_cooldown = 4.0
session_fence_min = 0.75
session_fence_quiet = 0.25
session_fence_timeout = 3.0
grace_read_initial_wait = 0.5
grace_read_window = 3.0
payload_quiet = 0.8

[cpin]
unknown_threshold = 3
checking_threshold = 2
max_removal_confirm = 2
poll_interval = 1.0
poll_timeout = 3.0

[verification]
delay_seconds = 15.0
read_timeout = 30.0

[injection]
max_concurrent = 2

[worker]
stabilization_seconds = 15.0
prompt_recovery_max = 2

[logging]
max_entries_per_port = 100
file_max_bytes = 204800
file_backup_count = 5

[ui]
drain_interval_ms = 100
port_scan_interval_ms = 3000
window_width = 1150
window_height = 700
